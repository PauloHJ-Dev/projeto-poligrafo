<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="projeto-poligrafo/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <title>Polígrafo</title>
</head>
<body>
    <div class="titulos">
        <h1 class="titulo1">O</h1>
        <h1 class="titulo">MENTALISTA</h1>
    </div>

     <h1 class="subtitulo">TESTE DO POLÍGRAFO</h1>
    
    <div class="formulario">
        <div class="forms">

    <!-- Tela inicial -->
    <section id="inicio">
        <h1>Formulário Dinâmico</h1>
        <p>Clique no botão para começar.</p>

        <button id="botaoIniciar">Iniciar</button>
    </section>

    <!-- Tela de perguntas -->
    <section id="formulario" hidden>
        <p id="contador"></p>

        <h2 id="pergunta"></h2>

        <!-- Opções de resposta -->
        <div id="opcoesResposta">
            <label>
                <input type="radio" name="resposta" value="Sim">
                Sim
            </label>

            <label>
                <input type="radio" name="resposta" value="Não">
                Não
            </label>
        </div>

        <button id="botaoProximo" disabled>
            Próxima pergunta
        </button>
    </section>

    <!-- Tela final -->
    <section id="resultado" hidden>
        <h2>Formulário concluído!</h2>
        <p id="resumo"></p>
    </section>

        </div>
    </div>

    <script src="/projeto-poligrafo/script.js"></script>
</body>
</html>

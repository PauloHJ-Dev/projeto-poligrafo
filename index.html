<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="projeto-poligrafo/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="projeto-poligrafo/imgs/letra-m.png">
    <title>Polígrafo</title>
</head>
<body>
    <div class="titulos">
        <h1 class="titulo1">O</h1>
        <h1 class="titulo">MENTALISTA</h1>
    </div>

     <h1 class="subtitulo">TESTE DO POLÍGRAFO</h1>
    
    <div class="formulario">
        <div class="forms">

    <!-- Tela inicial -->
    <section id="inicio">
        <div class="aviso">
            <h2>O que você esconde pode ser mais do que imagina!</h2>
        </div>
        <p>Clique no botão para começar o teste.</p>

        <button class="botao" id="botaoIniciar">Iniciar</button>
    </section>

    <!-- Tela de perguntas -->
    <section id="formulario" hidden>
        <p id="contador"></p>

        <h2 class="pergunta" id="pergunta"></h2>

        <!-- Opções de resposta -->
        <div class="opcoes" id="opcoes">
            <label>
                <input class="opcao-resposta" type="radio" name="resposta" value="Sim">
                Sim
            </label>

            <label>
                <input class="opcao-resposta" type="radio" name="resposta" value="Não">
                Não
            </label>
        </div>

        <button class="botao" id="botaoProximo" disabled>
            Próxima pergunta
        </button>
    </section>

    <!-- Tela final -->
    <section id="resultado" hidden>
        <h2>Resultados</h2>
        <p id="resumo"></p>
        <div class="classificacao">
        <h3>Classificação: </h3>
        <h3 id="classificacao"></h3>
        </div>
        <p id="descricao"></p>
        <button class="voltar" onclick="location.reload()">Voltar ao início</button>
        <button class="refazer" onclick="refazerTeste()">Refazer Teste</button>

    </section>

        </div>
    </div>

    <script src="projeto-poligrafo/script.js"></script>
</body>
</html>
